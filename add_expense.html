{% extends 'base.html' %}

{% block title %}Add Expense — ExpenseFlow{% endblock %}

{% block content %}
<div class="form-page reveal">
    <div class="form-card">
        <span class="eyebrow">FINANCE</span>
        <h1>Add Expense</h1>
        <p>Record money spent by the business.</p>

        <form method="post" enctype="multipart/form-data">
            <div class="form-grid">
                <label>
                    Title *
                    <input type="text" name="title" required placeholder="Office supplies">
                </label>

                <label>
                    Category *
                    <select name="category" required>
                        <option value="" disabled selected>Select category</option>
                        {% for c in categories %}
                            <option value="{{ c.name }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    Amount (₹) *
                    <input type="number" name="amount" min="0.01" step="0.01" required placeholder="0.00">
                </label>

                <label>
                    Date *
                    <input type="date" name="expense_date" value="{{ today }}" required>
                </label>

                <label>
                    Payment method
                    <input type="text" name="payment_method" placeholder="Cash, UPI, Card, Bank Transfer">
                </label>

                <label>
                    Receipt
                    <input type="file" name="receipt" accept=".pdf,.png,.jpg,.jpeg,.webp">
                    <small class="muted">PDF, PNG, JPG, JPEG or WEBP — max 5 MB.</small>
                </label>

                <label class="full">
                    Description
                    <textarea name="description" rows="5" placeholder="Optional details..."></textarea>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="primary">Save expense →</button>
                <a class="outline" href="{{ url_for('expenses') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
