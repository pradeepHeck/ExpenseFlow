{% extends 'base.html' %}{% block title %}Add Income — ExpenseFlow{% endblock %}{% block content %}<div
    class="form-page reveal">
    <div class="form-card"><span class="eyebrow">FINANCE</span>
        <h1>Add Income</h1>
        <p>Record money received by the business.</p>
        <form method="post">
            <div class="form-grid"><label>Source *<input name="source" required
                        placeholder="Product sales"></label><label>Category<select name="category">
                        <option value="">Select</option>{% for c in categories %}<option>{{c.name}}</option>{% endfor %}
                    </select></label><label>Amount (₹) *<input type="number" name="amount" min="0.01" step="0.01"
                        required></label><label>Date *<input type="date" name="income_date" value="{{today}}"
                        required></label><label>Payment method<select name="payment_method">
                        <option>Bank Transfer</option>
                        <option>UPI</option>
                        <option>Cash</option>
                        <option>Cheque</option>
                    </select></label><label class="full">Description<textarea name="description"
                        rows="5"></textarea></label></div>
            <div class="form-actions"><button class="primary">Save income →</button><a class="outline"
                    href="{{url_for('income')}}">Cancel</a></div>
        </form>
    </div>
</div>{% endblock %}
