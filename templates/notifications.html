{% extends 'base.html' %}{% block title %}Notifications — ExpenseFlow{% endblock %}{% block content %}<div class="page-head reveal"><div><span class="eyebrow">UPDATES</span><h1>Notifications</h1><p>Recent events and financial alerts.</p></div><form method="post" action="{{url_for('clear_notifications')}}"><button class="outline">Clear all</button></form></div><div class="panel reveal">{% for n in rows %}<div class="notification {{'unread' if not n.is_read else ''}}"><span>●</span><div><b>{{n.title}}</b><p>{{n.message}}</p><small>{{n.created_at}}</small></div></div>{% else %}<div class="empty">You're all caught up.</div>{% endfor %}</div>{% endblock %}
