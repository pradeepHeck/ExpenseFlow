{% extends 'base.html' %}{% block title %}Profile — ExpenseFlow{% endblock %}{% block content %}<div class="page-head reveal"><div><span class="eyebrow">ACCOUNT</span><h1>Profile</h1><p>Manage your account and password.</p></div></div><div class="grid-2"><div class="panel reveal"><h3>Account details</h3><form method="post" class="form-grid"><label>Name<input name="name" value="{{user.name}}" required></label><label>Email<input value="{{user.email}}" disabled></label><label>Role<input value="{{user.role|capitalize}}" disabled></label><button class="primary full">Save profile</button></form></div><div class="panel reveal"><h3>Change password</h3><form method="post" class="form-grid"><label>Current password<input type="password" name="old_password"></label><label>New password<input type="password" name="new_password" minlength="8"></label><button class="primary full">Update password</button></form></div></div>{% endblock %}
