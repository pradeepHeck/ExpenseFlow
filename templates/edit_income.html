{% extends 'base.html' %}{% block title %}Edit Income — ExpenseFlow{% endblock %}{% block content %}<div class="form-page reveal"><div class="form-card"><span class="eyebrow">FINANCE</span><h1>Edit Income</h1><p>Update the selected income record.</p><form method="post"><div class="form-grid"><label>Source *<input name="source" value="{{income.source}}" required></label><label>Category<select name="category"><option value="">Select</option>{% for c in categories %}<option {% if c.name==income.category %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Amount (₹) *<input type="number" name="amount" value="{{income.amount}}" min="0.01" step="0.01" required></label><label>Date *<input type="date" name="income_date" value="{{income.income_date}}" required></label><label>Payment method<input name="payment_method" value="{{income.payment_method or ''}}"></label><label class="full">Description<textarea name="description" rows="5">{{income.description or ''}}</textarea></label></div><div class="form-actions"><button class="primary">Update income →</button><a class="outline" href="{{url_for('income')}}">Cancel</a></div></form></div></div>{% endblock %}
